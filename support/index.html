<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patto! サポート</title>
    <meta name="description" content="Patto!（iOS / macOS）のサポートページ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --ink: #1b1b1b;
        --muted: #5f6066;
        --accent: #ff7a59;
        --accent-soft: #ffe9e1;
        --card: #ffffff;
        --stroke: #f0e7e2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at -10% -10%, #fff3e8 0%, transparent 60%),
          radial-gradient(900px 600px at 110% 10%, #eaf4ff 0%, transparent 55%),
          var(--bg);
      }
      main {
        max-width: 900px;
        margin: 48px auto 72px;
        padding: 28px 22px 40px;
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 22px;
        box-shadow: 0 24px 60px rgba(30, 30, 60, 0.08);
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 18px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-dot {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ffb191, #ff7a59);
        box-shadow: 0 6px 16px rgba(255, 122, 89, 0.35);
      }
      h1 {
        font-size: 28px;
        margin: 0;
        letter-spacing: 0.02em;
      }
      p {
        line-height: 1.8;
        color: var(--muted);
        margin: 0 0 10px;
      }
      section {
        margin-top: 16px;
        padding: 16px 18px;
        border-radius: 16px;
        border: 1px solid #f2ebe7;
        background: #fffaf7;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 18px;
        color: var(--accent);
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        position: relative;
        padding-left: 18px;
        line-height: 1.8;
        color: var(--muted);
      }
      li::before {
        content: "•";
        position: absolute;
        left: 0;
        color: var(--accent);
        font-weight: 700;
      }
      .note {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--accent-soft);
        color: #4a3a33;
        font-size: 14px;
      }
      .link {
        color: var(--accent);
        text-decoration: none;
      }
      .link:hover {
        text-decoration: underline;
      }
      footer {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px dashed #f2dcd3;
        color: var(--muted);
        font-size: 14px;
      }
      @media (max-width: 720px) {
        main {
          margin: 20px 14px 48px;
          padding: 22px 16px 30px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="title-row">
          <span class="logo-dot" aria-hidden="true"></span>
          <h1>Patto! サポート</h1>
        </div>
        <p>Patto!（iOS / macOS）に関するサポート情報です。</p>
      </header>

      <section>
        <h2>よくある質問</h2>
        <ul>
          <li>同期が有効にならない: Supabase設定（URL/ANON KEY）が必要です。</li>
          <li>クイック起動が反応しない: macOSは入力監視権限が必要な場合があります。</li>
          <li>AI編集が使えない: APIキーが未設定の可能性があります。</li>
        </ul>
        <div class="note">不具合の再現手順と端末情報があると調査が早くなります。</div>
      </section>

      <section>
        <h2>お問い合わせ</h2>
        <p>
          ご連絡は <a class="link" href="mailto:matsumoto.b.a@gmail.com">matsumoto.b.a@gmail.com</a> までお願いします。
        </p>
      </section>

      <footer>
        <strong>関連リンク</strong>
        <p><a class="link" href="https://shotaro311.github.io/Patto/privacy/">プライバシーポリシー</a></p>
      </footer>
    </main>
  </body>
</html>
